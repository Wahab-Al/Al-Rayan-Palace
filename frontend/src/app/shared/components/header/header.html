<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/">
      <img src="/alrayan-logo.png" alt="Al Rayan Palace" class="brand-logo" />

      <span class="brand-name"> Al Rayan Palace </span>
    </a>

    <nav class="nav">
      <a routerLink="/"> Home </a>

      <button
        type="button"
        class="theme-toggle"
        [attr.aria-pressed]="theme() === 'dark'"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="toggleTheme()"
      >
        <span aria-hidden="true">{{ theme() === 'dark' ? '☀' : '☾' }}</span>
        <span class="theme-label">{{ theme() === 'dark' ? 'Light' : 'Dark' }} mode</span>
      </button>

      @if (isAuthenticated()) {
        @if (!isManagePage()) {
          <a class="admin-link" routerLink="/admin/products"> Manage </a>
        }

        <button type="button" class="admin-link logout-button" (click)="logout()">Logout</button>
      } @else {
        <a
          href="https://www.instagram.com/alrayan_palacee/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Instagram
        </a>

        <a class="admin-link" routerLink="/admin/login"> Admin </a>
      }
    </nav>
  </div>
</header>

@if (totalPages() > 1) {
  <nav class="pagination" aria-label="Product pagination">
    <button type="button" [disabled]="currentPage() === 1" (click)="previousPage()">
      Previous
    </button>

    <div class="page-numbers">
      @for (page of pages(); track page) {
        <button type="button" [class.active]="page === currentPage()" (click)="goToPage(page)">
          {{ page }}
        </button>
      }
    </div>

    <button type="button" [disabled]="currentPage() === totalPages()" (click)="nextPage()">
      Next
    </button>
  </nav>
}

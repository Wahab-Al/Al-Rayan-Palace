<article class="product-card">
  <a
    class="media-link"
    [routerLink]="['/products', product().id]"
    [attr.aria-label]="'View ' + product().title"
  >
    <div class="product-media">
      @if (product().mediaType === 'image') {
        <img
          [src]="product().mediaUrl"
          [alt]="product().title"
          loading="lazy"
          decoding="async"
        />
      } @else {
        <video
          [src]="product().mediaUrl"
          muted
          autoplay
          loop
          playsinline
          preload="metadata"
        ></video>
      }

      @if (product().featured) {
        <span class="featured-badge"> Featured </span>
      }
    </div>
  </a>

  <div class="product-content">
    <span class="category">
      {{ product().category }}
    </span>

    <h3>
      <a [routerLink]="['/products', product().id]">
        {{ product().title }}
      </a>
    </h3>

    @if (product().description) {
      <p>
        {{ product().description }}
      </p>
    }

    <a
      class="details-link"
      [routerLink]="['/products', product().id]"
    >
      View Product
    </a>
  </div>
</article>

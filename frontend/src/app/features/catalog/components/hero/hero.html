<section class="hero">

    #heroVideo
    class="hero-video"
    autoplay

    loop
    playsinline
    preload="metadata"
    aria-hidden="true"
  >
    <source
      src="/videos/hero.mov"
      type="video/mp4"
    />
  </video>

  <!-- Overlay -->
  <div class="hero-overlay"></div>

  <!-- Content -->
  <div class="hero-content">

    <h1>Discover Your<br />Style</h1>

    <a
      class="hero-button"
      href="https://www.instagram.com/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Contact us on Instagram
    </a>
  </div>
</section>
